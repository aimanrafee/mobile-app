<div id="app-shell">
  <header id="app-topbar">
    <div class="topbar-in">
      <button type="button" class="tb-btn tb-back" id="btn-back" aria-label="Kembali" hidden><svg class="ic"><use href="#i-back"/></svg></button>
      <div class="tb-title" id="tb-title">Taubat<b>.App</b></div>
      <div class="tb-actions">
        <button type="button" class="tb-btn" id="btn-lang" aria-label="Bahasa / Language">MY</button>
        <button type="button" class="tb-btn" id="btn-theme" aria-label="Tukar tema"><svg class="ic"><use href="#i-moon"/></svg></button>
      </div>
    </div>
  </header>

  <main id="app-main" tabindex="-1">
    <!-- Skrin dirender oleh JS ke dalam #screen -->
    <div id="screen" aria-live="polite"></div>
  </main>

  <nav id="tabbar" aria-label="Navigasi utama">
    <button type="button" class="tab" data-tab="home" aria-label="Utama"><svg class="ic"><use href="#i-home"/></svg><span data-i18n="tab_home">Utama</span></button>
    <button type="button" class="tab" data-tab="quran" aria-label="Al-Quran"><svg class="ic"><use href="#i-book"/></svg><span>Quran</span></button>
    <button type="button" class="tab" data-tab="iqra" aria-label="Belajar Iqra"><svg class="ic"><use href="#i-iqra"/></svg><span data-i18n="tab_iqra">Iqra'</span></button>
    <button type="button" class="tab" data-tab="doa" aria-label="Mathurat dan Doa"><svg class="ic"><use href="#i-doa"/></svg><span data-i18n="tab_doa">Zikir</span></button>
    <button type="button" class="tab" data-tab="more" aria-label="Lain-lain"><svg class="ic"><use href="#i-grid"/></svg><span data-i18n="tab_more">Lainnya</span></button>
  </nav>
</div>

<!-- Debug mode: butang terapung + panel -->
<button type="button" id="debug-fab" aria-label="Buka panel debug" hidden><svg class="ic"><use href="#i-bug"/></svg></button>
<div id="debug-panel" role="dialog" aria-modal="true" aria-label="Panel debug" hidden>
  <div class="dp-sheet">
    <div class="dp-head">
      <strong>Debug Mode</strong>
      <div class="dp-tabs" role="tablist">
        <button type="button" role="tab" data-dtab="logs" aria-selected="true">Logs</button>
        <button type="button" role="tab" data-dtab="state" aria-selected="false">State</button>
        <button type="button" role="tab" data-dtab="info" aria-selected="false">Info</button>
        <button type="button" role="tab" data-dtab="actions" aria-selected="false">Actions</button>
      </div>
      <button type="button" class="dp-close" id="dp-close" aria-label="Tutup panel debug"><svg class="ic"><use href="#i-close"/></svg></button>
    </div>
    <div class="dp-body" id="dp-body"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:2rem;text-align:center">Aplikasi ini memerlukan JavaScript.</p></noscript>
</body>
</html>
